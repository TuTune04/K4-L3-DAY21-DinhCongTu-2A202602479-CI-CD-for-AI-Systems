name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi S3).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          SECRET=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(float(json.load(open('outputs/report.json'))['f1_score']))")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          echo "f1_score=$F1"

      - name: Upload candidate model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ['ARTIFACT_BUCKET']
          s3 = boto3.client('s3')
          s3.upload_file('models/model.joblib', bucket, 'artifacts/candidate/model.joblib')
          s3.upload_file('outputs/report.json', bucket, 'artifacts/candidate/report.json')
          print(f's3://{bucket}/artifacts/candidate/model.joblib')
          print(f's3://{bucket}/artifacts/candidate/report.json')
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65, dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          SECRET=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> "$GITHUB_ENV"

      - name: Promote candidate to current
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          aws s3 cp "s3://$ARTIFACT_BUCKET/artifacts/candidate/model.joblib" "s3://$ARTIFACT_BUCKET/artifacts/current/model.joblib"
          aws s3 cp "s3://$ARTIFACT_BUCKET/artifacts/candidate/report.json" "s3://$ARTIFACT_BUCKET/artifacts/current/report.json"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 10); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then echo; echo "Health check passed."; exit 0; fi
              echo "Health check attempt $i failed, retrying..."
            done
            echo "Health check failed after 10 attempts."
            exit 1
